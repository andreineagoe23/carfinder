# Re-runs every saved search twice a day and (optionally) sends new cars to Telegram.
# Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets to get alerts.
name: refresh

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev --frozen
      - run: scripts/results-branch.sh checkout
      - run: uv run carfinder refresh --results-dir results --notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: scripts/results-branch.sh push "refresh ${{ github.run_id }}"
